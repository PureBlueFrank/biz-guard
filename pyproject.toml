[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bizguard"
version = "0.1.0"
description = "Deterministic business-change safety checks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.29.0,<2.0",
  "pydantic>=2",
  "numpy",
  "httpx",
  "PyYAML>=6.0",
  "tree-sitter==0.24.0",
  "tree-sitter-java==0.23.5",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
]

[project.scripts]
bizguard = "bizguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bizguard", "agents_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "agents_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
