[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bizguard"
version = "0.1.0"
description = "Deterministic business-change safety checks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp",
  "pydantic>=2",
  "numpy",
  "httpx",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
]

[project.scripts]
bizguard = "bizguard.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "agents_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
