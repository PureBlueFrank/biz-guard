name: bizguard
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bizguard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: bizguard_test
          POSTGRES_USER: bizguard
          POSTGRES_PASSWORD: bizguard-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bizguard -d bizguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIZGUARD_TEST_POSTGRES_URL: postgresql://bizguard:bizguard-test-only@127.0.0.1:5432/bizguard_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install --prefer-binary --only-binary=tree-sitter,tree-sitter-java -e '.[dev,production]'
      - run: python -m ruff check src tests agents_mcp
      - run: python -m ruff check --select D101,D103 src/bizguard agents_mcp
      - run: python -m mypy src tests agents_mcp
      - run: PYTHONHASHSEED=0 python -m pytest -q
  gate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve trusted base revision
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          git fetch origin "$base" --depth=1
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"
      - name: Generate change diff and base revisions
        run: |
          git diff "${{ steps.base.outputs.sha }}" HEAD > /tmp/pr.diff
          printf 'revision: %s\n' "${{ steps.base.outputs.sha }}" > /tmp/base-revisions.yaml
      - name: Install trusted BizGuard engine from base revision
        run: |
          mkdir -p "$RUNNER_TEMP/bizguard-trusted"
          git archive "${{ steps.base.outputs.sha }}" | tar -x -C "$RUNNER_TEMP/bizguard-trusted"
          python -m venv "$RUNNER_TEMP/bizguard-venv"
          "$RUNNER_TEMP/bizguard-venv/bin/pip" install \
            --prefer-binary \
            --only-binary=tree-sitter,tree-sitter-java \
            --constraint "$RUNNER_TEMP/bizguard-trusted/requirements-production.lock" \
            "$RUNNER_TEMP/bizguard-trusted[production]"
      - name: Policy promotion governance gate
        run: |
          trusted_python="$RUNNER_TEMP/bizguard-venv/bin/python"
          trusted_root="$RUNNER_TEMP/bizguard-trusted"
          if "$trusted_python" -c 'import bizguard.policy.governance_gate' 2>/dev/null; then
            runner="$trusted_python"
            gates="$trusted_root/policy/calibration-gates.yaml"
            public_key="$trusted_root/policy/calibration-public-key.pem"
          else
            python -m venv "$RUNNER_TEMP/bizguard-current-venv"
            runner="$RUNNER_TEMP/bizguard-current-venv/bin/python"
            "$RUNNER_TEMP/bizguard-current-venv/bin/pip" install \
              --prefer-binary \
              --only-binary=tree-sitter,tree-sitter-java \
              --constraint requirements-production.lock \
              '.[production]'
            gates="policy/calibration-gates.yaml"
            public_key="policy/calibration-public-key.pem"
          fi
          "$runner" -m bizguard.policy.governance_gate \
            --base-registry "$trusted_root/policy/phase5-registry.yaml" \
            --current-registry policy/phase5-registry.yaml \
            --gates "$gates" \
            --public-key "$public_key" \
            --bundle-directory policy/calibration
      - name: BizGuard safety gate
        id: gate
        env:
          BIZGUARD_CATALOG_PATH: ${{ runner.temp }}/bizguard-trusted/src/bizguard/semantic/catalog.yaml
          BIZGUARD_POLICY_REGISTRY_PATH: ${{ runner.temp }}/bizguard-trusted/policy/phase5-registry.yaml
          BIZGUARD_CONTRACT_REGISTRY_PATH: ${{ runner.temp }}/bizguard-trusted/registry/contracts.yaml
          BIZGUARD_INVARIANTS_PATH: ${{ runner.temp }}/bizguard-trusted/policy/invariants.yaml
          BIZGUARD_KNOWLEDGE_ROOT: ${{ runner.temp }}/bizguard-trusted/knowledge/published
          BIZGUARD_INVARIANT_KNOWLEDGE_ROOT: ${{ runner.temp }}/bizguard-trusted/knowledge
        run: |
          set +e
          "$RUNNER_TEMP/bizguard-venv/bin/python" -m bizguard.ci.runner \
            --diff /tmp/pr.diff \
            --base-revisions /tmp/base-revisions.yaml \
            --repository-root "$RUNNER_TEMP/bizguard-trusted" \
            --test-root fixtures/java-microservices \
            --test-evidence-out /tmp/bizguard-test-evidence.json \
            --audit-log /tmp/bizguard-audit.json \
            --json > /tmp/bizguard-result.json
          code=$?
          set -e
          {
            echo "## BizGuard decision"
            python - /tmp/bizguard-result.json <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1]))
          print(f"- decision: `{payload.get('decision')}`")
          print(f"- rationale: {payload.get('rationale')}")
          print(f"- required approvers: {payload.get('required_approvers')}")
          print(f"- evidence: {payload.get('evidence')}")
          for test in payload.get("required_tests", []):
              print(f"- required test: {test.get('id')}")
          for finding in payload.get("findings", []):
              print(f"- finding: {finding.get('id')} -> {finding.get('effect')}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Upload BizGuard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bizguard-gate-evidence
          path: |
            /tmp/bizguard-result.json
            /tmp/bizguard-audit.json
            /tmp/bizguard-test-evidence.json
