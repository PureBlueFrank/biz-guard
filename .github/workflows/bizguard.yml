name: bizguard
on: [pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e .[dev]
      - run: python -m ruff check src tests agents_mcp
      - run: python -m ruff check --select D101,D103 src/bizguard agents_mcp
      - run: python -m mypy src tests agents_mcp
      - run: python -m pytest -q
